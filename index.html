<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>척척 용돈통장</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6f5c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{
  --bg:#e7f3ee; --panel:#ffffff; --panel2:#f3faf7; --ink:#18352f; --muted:#5b7870; --line:#cfe3db;
  --brand:#1f6f5c; --brand-ink:#ffffff; --coin:#f2b632; --coin-ink:#5a3d00;
  --ok:#2a9d63; --ok-bg:#e2f6ea; --bad:#d9534a; --bad-bg:#fde8e6; --lock:#9fb3ac;
  --math:#3d7be0; --kor:#e0673d; --int:#2a9d63; --soc:#8a5fd0; --sci:#0f9bb0; --eng:#d04f8a; --mor:#b08a1f;
  --radius:18px; --shadow:0 2px 0 rgba(24,53,47,.12);
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0f1d1a; --panel:#172a26; --panel2:#1d332e; --ink:#e3f2ec; --muted:#9ab8ae; --line:#2b4640;
  --brand:#3fae90; --brand-ink:#08201a; --coin:#f5c451; --coin-ink:#3a2800;
  --ok:#4cc987; --ok-bg:#163a28; --bad:#f07b72; --bad-bg:#3d1f1d; --lock:#50665f; --shadow:0 2px 0 rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0f1d1a; --panel:#172a26; --panel2:#1d332e; --ink:#e3f2ec; --muted:#9ab8ae; --line:#2b4640;
  --brand:#3fae90; --brand-ink:#08201a; --coin:#f5c451; --coin-ink:#3a2800;
  --ok:#4cc987; --ok-bg:#163a28; --bad:#f07b72; --bad-bg:#3d1f1d; --lock:#50665f; --shadow:0 2px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;padding-inline:16px;padding-block:0 32px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* 통장 헤더 */
.book{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:12px 16px 10px;background:var(--brand);color:var(--brand-ink)}
.book-in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.book .who{font-family:var(--display);font-size:18px;line-height:1.2}
.book .who small{display:block;font-family:var(--body);font-size:12px;opacity:.85}
.book .bal{margin-left:auto;text-align:right}
.book .bal small{display:block;font-size:12px;opacity:.85}
.book .bal b{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.5px}
.goal{max-width:520px;margin:8px auto 0;height:10px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.goal i{display:block;height:100%;background:var(--coin);border-radius:99px;transition:width .5s}
.goal-lab{max-width:520px;margin:4px auto 0;font-size:12px;opacity:.9;display:flex;justify-content:space-between}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-family:var(--display);font-size:18px;box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.coin{background:var(--coin);color:var(--coin-ink);border-color:transparent}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* 과목 */
.subj{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sbtn{position:relative;text-align:left;padding:14px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--c);box-shadow:var(--shadow);min-height:86px;display:flex;flex-direction:column;gap:2px}
.sbtn .disp{font-size:22px;color:var(--c)}
.sbtn small{color:var(--muted);font-size:13px;word-break:keep-all}
.sbtn.locked{--c:var(--lock)!important;cursor:default;box-shadow:none;opacity:.8}
.sbtn{padding-right:50px}
.sicon{position:absolute;top:10px;right:10px;width:36px;height:36px}
.sbtn.locked .sicon{filter:grayscale(1);opacity:.5}

/* 펫 */
.petcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;box-shadow:var(--shadow)}
.petcard .disp{font-size:20px}
.petcard .note{display:block}
.pet{display:block;position:relative;flex:none;aspect-ratio:1}
.pet > img{width:100%;height:100%;display:block}
.pet .wear{position:absolute;height:auto;pointer-events:none}
.gauge{display:block;height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.gauge i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .4s}
.gauge.low i{background:var(--bad)}
.gauge.exp i{background:var(--coin)}
.room{position:relative;border-radius:var(--radius);background:linear-gradient(to bottom,var(--panel2) 72%,var(--line) 72%);overflow:hidden;aspect-ratio:5/4}
.room .house{position:absolute;left:3%;bottom:10%;width:30%}
.room .blanket{position:absolute;left:50%;bottom:1%;width:72%;transform:translateX(-50%) scaleY(.55);transform-origin:bottom}
.room .pet{position:absolute;left:50%;bottom:9%;width:56%;transform:translateX(-50%)}
.bubble{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:8px 14px;font-family:var(--display);font-size:18px;text-align:center}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);box-shadow:var(--shadow);font-size:15px;line-height:1.3}
.item img{width:52px;height:52px}
.item small{color:var(--muted);font-size:13px}
.item[aria-pressed="true"]{border:2px solid var(--brand)}
.wonder{display:flex;flex-direction:column;gap:10px;border-left:8px solid var(--coin)}
.wonder .disp{font-size:22px;line-height:1.4;word-break:keep-all;margin:0}
.linkrow{display:flex;flex-direction:column;justify-content:center;min-height:56px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);text-decoration:none;box-shadow:var(--shadow)}
.linkrow .disp{font-size:18px;color:var(--brand)}
.linkrow small{color:var(--muted);font-size:14px}
.linkrow:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
/* 출석 도장 */
.attend{display:flex;flex-direction:column;gap:8px;padding:12px 16px}
.stamps{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:2px}
.stamp b{width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--brand-ink)}
.stamp.on b{border:0;background:var(--kor);transform:rotate(-8deg)}
.stamp.today b{border-color:var(--coin)}
.stamp small{font-size:12px;color:var(--muted)}
/* 우주 스티커 */
.stk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stk{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;background:var(--stk-bg,#162447);color:#fff;border:2px solid rgba(255,255,255,.15);min-height:48px;font-family:var(--display);font-size:16px}
.stk img{width:72px;height:72px}
.stk.none img,.stk.none .stk-ph{filter:brightness(0) opacity(.35)}
.stk-ph{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--coin);color:var(--coin-ink);font-family:var(--display);font-size:32px;border:3px solid #18352f}
/* 반짝 스티커: 같은 스티커 3장 */
.stk.shiny,.stk-big.shiny{border:3px solid transparent;background:linear-gradient(var(--stk-bg,#162447),var(--stk-bg,#162447)) padding-box,linear-gradient(120deg,#ff7eb3,#ffd54a,#7ee8a2,#6fc9ff,#c79bff,#ff7eb3) border-box;background-size:100% 100%,300% 300%;animation:shine 3s linear infinite}
.stk.shiny img,.stk-big.shiny img{filter:drop-shadow(0 0 6px #fff6b0)}
.stk-big{display:inline-flex;border-radius:24px;padding:6px}
.stk-big.shiny{--stk-bg:var(--panel)}
@keyframes shine{to{background-position:0 0,300% 0}}
@media (prefers-reduced-motion:reduce){.stk.shiny,.stk-big.shiny{animation:none}}
.stk.none span{color:#9aa6c4}
.stk small{position:absolute;top:6px;right:8px;font-size:13px;color:var(--coin)}
.stk-pop{position:fixed;inset:0;z-index:50;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.stk-card{background:var(--panel);border-radius:22px;padding:20px;max-width:320px;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;animation:stkIn .35s ease-out}
@keyframes stkIn{from{transform:scale(.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.stk-card{animation:none}}
/* 리포트 */
.rbar{display:grid;grid-template-columns:64px 1fr 72px;gap:8px;align-items:center;font-size:15px}
.rbar .bar{height:10px}

/* 방꾸미기 */
.rstage{position:relative;width:100%;aspect-ratio:4/5;border-radius:var(--radius);overflow:hidden;border:2px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.rwall{position:absolute;inset:0 0 42% 0;background:var(--wall)}
.rfloor{position:absolute;inset:58% 0 0 0;background:var(--floor)}
.rwall::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:8px;background:rgba(0,0,0,.08)}
.ritem{position:absolute;transform:translate(-50%,-50%)}
.ritem > img,.ritem > .pet,.ritem > .room-ph{display:block;width:100%;height:auto;transform:scaleX(var(--fx,1))}
.rstage.edit .ritem{cursor:grab}
.ritem.sel{outline:3px dashed var(--coin);outline-offset:4px;border-radius:8px;z-index:20}
.ritem.rpet.hop{animation:rhop .5s ease-out 2}
@keyframes rhop{40%{margin-top:-14px}}
.room-ph{display:flex;align-items:center;justify-content:center;aspect-ratio:3/2;border-radius:14px;border:3px solid #18352f;background:#fff8e1;color:#18352f;font-family:var(--display);font-size:13px;text-align:center;padding:4px;word-break:keep-all;line-height:1.2}
.rtool{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border-radius:14px;padding:8px}
.rtool[hidden]{display:none}
.rtname{font-weight:400;font-size:15px}
.rtbtns{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.rtbtns .btn{min-height:44px;font-size:14px;padding:4px 2px}
/* 편집할 때는 방·도구·탭을 머리 바로 아래에 붙이고, 가게만 아래에서 스크롤한다 */
.rsticky{position:sticky;top:var(--bookh,120px);z-index:4;display:flex;flex-direction:column;gap:8px;background:var(--panel);padding:6px 0 8px;margin:-6px 0 0}
.rsticky .rstage{width:min(100%,250px);margin:0 auto}
.rsticky .rtool{padding:6px;gap:4px}
.rsticky .chips .chip{padding:6px 12px}
.rshop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rsitem{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);box-shadow:var(--shadow);min-height:48px;font-size:14px;line-height:1.25;text-align:center;word-break:keep-all}
.rsitem b{font-weight:400}
.rsitem small{color:var(--muted);font-size:12px}
.rsitem[aria-pressed="true"]{border:2px solid var(--brand)}
.rsimg{display:flex;align-items:center;justify-content:center;width:64px;height:64px}
.rsimg img{max-width:64px;max-height:64px}
.rsimg .room-ph{width:64px;font-size:11px}
.rsimg.pat{border-radius:12px;border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.ritem.rpet.hop{animation:none}}
/* 배움터 */
.lcard{display:flex;flex-direction:column;gap:10px;min-height:220px;justify-content:center}
.lcard .disp{font-size:24px;color:var(--brand)}
.lcard p{margin:0;font-size:19px;line-height:1.6;word-break:keep-all}
.lex{background:var(--panel2);border:2px dashed var(--coin);border-radius:14px;padding:12px 14px;font-size:19px;word-break:keep-all}
.ldots{display:flex;justify-content:center;gap:6px}
.ldots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.ldots i.on{background:var(--brand)}
.llist{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);border-left:6px solid var(--c);background:var(--panel);text-align:left;box-shadow:var(--shadow);min-height:56px}
.lrow .disp{font-size:18px}
.lrow small{display:block;color:var(--muted);font-size:13px}
.lrow .ok{margin-left:auto;color:var(--ok);font-family:var(--display);font-size:15px;white-space:nowrap}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bitem{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-family:var(--display);font-size:15px;min-height:48px}
.bitem img{width:64px;height:64px}
.bitem .ok{position:absolute;top:4px;right:6px;color:var(--ok);font-size:14px}
.bfacts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:18px;word-break:keep-all}
.oxbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oxbtns button{min-height:72px;border-radius:16px;font-family:var(--display);font-size:40px;background:var(--panel);border:2px solid var(--line);box-shadow:var(--shadow)}
.oxbtns button.ok{border-color:var(--ok);background:var(--ok-bg)}
.oxbtns button.no{border-color:var(--bad);background:var(--bad-bg)}

/* 척척이 (AI 친구) */
.chukcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;box-shadow:var(--shadow);border:2px solid #bfe8d6}
.chukcard .disp{font-size:20px}
.chuk{flex:none}
.chuk-say{display:block;margin-top:4px;padding:8px 12px;border-radius:14px 14px 14px 4px;background:var(--panel2);border:1px solid var(--line);font-size:15px;line-height:1.45;word-break:keep-all}
.aigrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.aigrid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:var(--radius);background:var(--panel2);border:1px solid var(--line);box-shadow:var(--shadow);min-height:48px;text-align:center}
.aigrid b{font-family:var(--display);font-weight:400;font-size:18px}
.aigrid small{color:var(--muted);font-size:12px;word-break:keep-all}
.msg.ai{display:flex;gap:6px;align-items:flex-start}
.msg.ai .chuk{margin-top:2px}
.micbtn{flex:none;min-width:52px;padding:6px 10px;font-size:20px}
.micbtn.on{background:var(--bad);color:#fff;font-size:14px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
.story{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:4px}
.story p{margin:0;padding:10px 12px;border-radius:14px;font-size:17px;line-height:1.55;word-break:keep-all;white-space:pre-line}
.story p.ai{background:var(--panel2);border:1px solid var(--line)}
.story p.ai .chuk{vertical-align:middle;margin-right:4px}
.story p.me{background:var(--ok-bg);border:1px solid var(--ok);align-self:flex-end}
.story p.wait{color:var(--muted)}
.sbook{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--panel)}
.sbook summary{cursor:pointer;min-height:32px}
@media (prefers-reduced-motion:reduce){.micbtn.on{animation:none}}

/* 코딩 놀이 */
.lvgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.lvgrid button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);box-shadow:var(--shadow);min-height:48px}
.lvgrid button[disabled]{opacity:.5}
.lvgrid b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--brand)}
.lvgrid small{font-size:13px;color:var(--muted)}
.lvgrid em{position:absolute;top:6px;right:8px;font-style:normal;font-size:11px;background:var(--coin);color:var(--coin-ink);border-radius:99px;padding:1px 6px}
.lvstar{color:var(--coin);letter-spacing:2px}
.cboard{position:relative;display:grid;grid-template-columns:repeat(5,1fr);width:min(100%,300px);aspect-ratio:1;margin:0 auto;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#dff0e6}
.ccell{display:flex;align-items:center;justify-content:center;border:1px dashed rgba(24,53,47,.12)}
.ccell.rock{background:radial-gradient(circle at 50% 55%,#9aa39f 0 34%,#6f7773 35% 38%,transparent 39%)}
.ccell.bump{background-color:var(--bad-bg);animation:shake .35s}
.ccell img{width:70%;height:auto}
.cstar{font-size:28px;color:var(--coin);text-shadow:0 1px 0 #b8860b}
.cstar.got{opacity:.2}
.cpet{position:absolute;width:20%;height:20%;transition:left .3s ease,top .3s ease;pointer-events:none}
.cprog{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:52px}
.cslot{display:flex;flex-direction:column;align-items:center;justify-content:center;width:48px;height:52px;border-radius:12px;background:var(--panel);border:2px solid var(--brand);font-size:24px;line-height:1}
.cslot small{font-size:11px;color:var(--muted)}
.cslot.empty{border:2px dashed var(--line);background:transparent}
.cslot.now{background:var(--coin);border-color:var(--coin)}
.crep{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.crep button{min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);font-family:var(--display);font-size:17px}
.crep button[aria-pressed="true"]{border-color:var(--coin);background:var(--coin);color:var(--coin-ink)}
.cpad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cpad button{min-height:60px;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-size:30px;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){.cpet{transition:none}}

/* 꿈 저금통 */
.dreambar{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border-radius:var(--radius);background:var(--panel);border:2px solid var(--coin);box-shadow:var(--shadow);text-align:left;min-height:56px}
.dreambar b{font-family:var(--display);font-weight:400;font-size:18px}
.dreambar small{display:block;color:var(--muted);font-size:13px}
.dreambar.empty{border-style:dashed}
.dreambar.ready{background:var(--ok-bg);border-color:var(--ok)}
.dream-emoji{line-height:1;flex:none}
.dream-photo{flex:none;object-fit:cover;border-radius:12px;border:2px solid var(--line)}
.jar{width:170px;height:auto}
.dicons{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.dicons button{font-size:28px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--panel2)}
.dicons button[aria-pressed="true"]{border-color:var(--brand);background:var(--ok-bg)}

/* 부모님 메뉴: 경고, 대화 기록, 백업 알림 */
.card.warn{border:2px solid var(--bad);background:var(--bad-bg)}
.clog{display:flex;flex-direction:column;gap:8px;margin-top:8px;max-height:420px;overflow-y:auto}
.citem{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:12px;background:var(--panel2);font-size:15px;word-break:keep-all}
.bkremind{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;border:1px dashed var(--bad);color:var(--ink);font-size:14px;background:var(--panel);text-align:left;width:100%;min-height:48px}

/* 첫 화면 바로가기 4칸 */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.quick button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);font-family:var(--display);font-size:15px;min-height:48px}
.quick img{width:44px;height:44px;object-fit:contain}
.quick small{font-family:var(--body);font-size:11px;color:var(--muted)}
/* 첫 화면: 움직이는 우주 풍경 */
.scene{position:relative;height:210px;border-radius:var(--radius);overflow:hidden;border:2px solid var(--line);background:linear-gradient(#bfe6ff,#e9f7ee);isolation:isolate}
.scene.dusk{background:linear-gradient(#5b4b9a,#f2a37c)}
.scene.night{background:linear-gradient(#0d1b3e,#2a1f4f)}
.scene > *{position:absolute}
.sc-star{width:4px;height:4px;border-radius:50%;background:#fff;animation:twinkle 2.4s ease-in-out infinite}
.scene.day .sc-star{display:none}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.4)}}
.sc-sun{top:10px;left:12px;font-size:34px;animation:float 4s ease-in-out infinite}
.sc-cloud{font-size:34px;opacity:.9;animation:drift 38s linear infinite}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(560px)}}
.sc-planet{width:54px;height:54px;animation:float 5s ease-in-out infinite;pointer-events:none}
.sc-astro{width:56px;height:56px;animation:astro 7s ease-in-out infinite;pointer-events:none}
@keyframes astro{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(14px,-10px) rotate(10deg)}}
.sc-sat{width:34px;height:34px;animation:orbit 9s linear infinite;pointer-events:none}
@keyframes orbit{from{transform:translate(0,0)}25%{transform:translate(40px,-14px)}50%{transform:translate(80px,0)}75%{transform:translate(40px,14px)}to{transform:translate(0,0)}}
.sc-rocket{width:44px;height:44px;left:-60px;bottom:50px;animation:fly 14s linear infinite;animation-delay:2s;cursor:pointer;border:0;padding:0;background:none;z-index:2}
.sc-rocket img{width:100%;height:100%;display:block}
.sc-rocket.zoom{animation:fly 2.2s linear 1}
@keyframes fly{0%{transform:translate(0,0);opacity:1}70%{opacity:1}100%{transform:translate(560px,-150px);opacity:0}}
.sc-comet{top:24px;left:0;width:70px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#fff);opacity:0;animation:comet 9s ease-in infinite;animation-delay:4s}
@keyframes comet{0%{transform:translate(520px,-10px) rotate(25deg);opacity:0}4%{opacity:1}12%{transform:translate(200px,50px) rotate(25deg);opacity:0}100%{opacity:0}}
.sc-ground{left:-5%;right:-5%;bottom:-14px;height:56px;border-radius:50% 50% 0 0;background:#5fbf86;border-top:4px solid #3f9e68}
.scene.night .sc-ground,.scene.dusk .sc-ground{background:#2f7d5c;border-top-color:#256a4c}
.sc-petbtn{left:50%;bottom:12px;transform:translateX(-50%);padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;z-index:1}
.sc-petbtn .pet{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.sc-petbtn.sleepy .pet{animation:breathe 4s ease-in-out infinite}
.sc-petbtn.hungry .pet{animation:none}
.sc-petbtn.hop .pet{animation:hop2 .5s ease-out 1}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-8px) scale(.98,1.03)}70%{transform:translateY(0) scale(1.03,.97)}}
@keyframes breathe{50%{transform:scale(1.03,.98)}}
@keyframes hop2{40%{transform:translateY(-22px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}}
.sc-bubble{left:50%;top:10px;transform:translateX(-50%);max-width:70%;padding:6px 12px;border-radius:16px;background:#fff;color:#18352f;font-family:var(--display);font-size:16px;text-align:center;box-shadow:var(--shadow);word-break:keep-all;pointer-events:none;z-index:3}
.sc-heart{font-size:22px;pointer-events:none;animation:heartUp 1.1s ease-out forwards;z-index:4}
@keyframes heartUp{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-70px) scale(1.2);opacity:0}}
.petbar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;min-height:56px;box-shadow:var(--shadow)}
.petbar .disp{font-size:18px}
.petbar .note{display:block;font-size:14px}
/* 첫 화면 탭 */
.htabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px;border-radius:16px;background:var(--panel2);border:1px solid var(--line)}
.htab{position:relative;min-height:48px;border-radius:12px;font-family:var(--display);font-size:18px;color:var(--muted)}
.htab[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);box-shadow:var(--shadow)}
.htab i{position:absolute;top:6px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1.4s ease-in-out infinite}
.hpanel{display:flex;flex-direction:column;gap:14px;animation:panelIn .25s ease-out}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}}
/* 놀이 바로가기: 통통 튀는 큰 타일 */
.play{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.play button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 4px 10px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);font-family:var(--display);font-size:16px;min-height:104px}
.play img,.play .em{width:56px;height:56px;object-fit:contain;animation:bob 3s ease-in-out infinite;animation-delay:calc(var(--i) * .35s);font-size:44px;line-height:56px;text-align:center}
.play button:active img,.play button:active .em{animation:hop2 .4s ease-out 1}
.play small{font-family:var(--body);font-size:12px;color:var(--muted)}
.cta-reward{animation:ctaPulse 1.6s ease-in-out infinite}
@keyframes ctaPulse{50%{transform:scale(1.02);box-shadow:0 0 0 6px rgba(242,182,50,.35)}}
.stamp.today b{animation:pulse 1.6s ease-in-out infinite}
.sbtn .sicon{animation:bob 3.4s ease-in-out infinite;animation-delay:calc(var(--i,0) * .3s)}
@media (prefers-reduced-motion:reduce){.scene *,.play img,.play .em,.cta-reward,.stamp.today b,.sbtn .sicon,.hpanel,.htab i{animation:none!important}}
/* 풍경 속 스티커 친구들 · 행운 알 */
.sc-crit{padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;z-index:1}
.sc-crit img,.sc-crit .stk-ph{display:block;width:100%;height:auto}
.sc-crit.sky{animation:float 5s ease-in-out infinite}
.sc-crit.ground{bottom:8px;width:44px;height:44px;animation:stroll var(--w,6s) ease-in-out infinite alternate}
.sc-crit.ground span{display:block;animation:flipx calc(var(--w,6s) * 2) steps(1) infinite}
@keyframes stroll{to{transform:translateX(34px)}}
@keyframes flipx{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
.sc-crit.shiny{filter:drop-shadow(0 0 6px #fff6b0)}
.sc-egg{right:6%;bottom:10px;padding:0;z-index:2;transform-origin:50% 100%}
.sc-egg.ready{animation:eggwob 1.6s ease-in-out infinite;filter:drop-shadow(0 0 8px #ffe27a)}
.sc-egg.lock{filter:grayscale(1);opacity:.6}
@keyframes eggwob{0%,60%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}30%{transform:rotate(8deg)}45%{transform:rotate(-5deg)}}
.egg-big{padding:6px}
.egg-big.shk svg{animation:eggshake .35s ease-in-out 1}
.egg.wob{animation:eggwob 1.6s ease-in-out infinite}
@keyframes eggshake{25%{transform:rotate(-10deg) scale(1.05)}75%{transform:rotate(10deg) scale(1.05)}}
/* 스티커 놀이판 */
.bstage{position:relative;width:100%;aspect-ratio:1;border-radius:var(--radius);overflow:hidden;border:2px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.bstar{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.85}
.bempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;margin:0;color:rgba(0,0,0,.4);font-family:var(--display);font-size:18px;pointer-events:none;text-align:center;padding:16px}
.bpiece{position:absolute;cursor:grab}
.bpiece img,.bpiece .stk-ph{display:block;width:100%;height:auto;pointer-events:none}
.bpiece.sel{outline:3px dashed var(--coin);outline-offset:3px;border-radius:8px;z-index:20}
.btools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btools button{min-height:48px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:14px;box-shadow:var(--shadow)}
.btools button.del{color:var(--bad)}
.btools p{grid-column:1/-1}
.btray{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:210px;overflow:auto;padding:6px;border-radius:14px;background:#162447}
.btray button{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:12px;background:rgba(255,255,255,.08)}
.btray button:active{background:rgba(255,255,255,.25)}
.btray img,.btray .stk-ph{width:48px;height:48px}
/* 도토리 돌보기 */
.carehome{display:flex;justify-content:center;padding:6px 0}
.carehome .pet{animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.caretasks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.care-task{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:var(--radius);background:var(--panel2);border:1px solid var(--line);box-shadow:var(--shadow);min-height:96px;font-family:var(--display);font-size:16px}
.care-task .em{font-size:34px;line-height:1.1}
.care-task small{font-family:var(--body);font-size:12px;color:var(--muted)}
.care-task.done{background:var(--ok-bg);border-color:var(--ok)}
.care-stage{position:relative;width:100%;height:230px;border-radius:16px;background:linear-gradient(#cfeee0,#a8dcc0);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.care-stage::after{content:'';position:absolute;inset:0;background:rgba(10,20,50,var(--dim,0));pointer-events:none;transition:background .4s}
.care-stage.hop .pet{animation:hop2 .5s ease-out 1}
.care-stage .pet{pointer-events:none}
.foam{position:absolute;border-radius:50%;background:rgba(255,255,255,.92);border:2px solid #bfe3f2;pointer-events:none;animation:foamIn .25s ease-out}
.foam.pop{animation:foamOut .6s ease-in forwards}
@keyframes foamIn{from{transform:scale(.3)}}
@keyframes foamOut{to{transform:scale(1.6);opacity:0}}
.spark{position:absolute;font-size:30px;animation:heartUp 1.2s ease-out forwards;pointer-events:none}
.ball{position:absolute;font-size:44px;line-height:1;width:56px;height:56px;transition:left .35s ease-out,top .35s ease-out;z-index:2}
.cstar{position:absolute;font-size:38px;width:52px;height:52px;z-index:2;animation:twinkle 1.6s ease-in-out infinite}
.zzz{position:absolute;top:14%;right:18%;font-family:var(--display);font-size:26px;color:#fff;animation:float 2s ease-in-out infinite;z-index:3}
/* 그림 그리기 */
.pages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pages button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);box-shadow:var(--shadow);font-family:var(--display);font-size:15px;min-height:48px}
.pages canvas,.pages img{width:100%;height:auto;aspect-ratio:1;border-radius:10px;background:#fff;display:block}
.cwrap{position:relative;width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.cwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.cwrap #lines{pointer-events:none}
.dtools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dtools button{min-height:48px;padding:0 2px;white-space:nowrap;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:14px;box-shadow:var(--shadow)}
.dtools button[aria-pressed="true"]{border:2px solid var(--brand);background:var(--panel)}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.palette button{min-height:48px;border-radius:50%;background:var(--c);border:2px solid var(--line);box-shadow:var(--shadow)}
.palette button[aria-pressed="true"]{outline:4px solid var(--coin);outline-offset:1px}
.pet .wear.emo{line-height:1;text-align:center;transform-origin:center}
.pet{container-type:inline-size}
@media (prefers-reduced-motion:reduce){.sc-crit,.sc-crit span,.sc-egg.ready,.egg.wob,.egg-big.shk svg,.cstar,.carehome .pet,.zzz{animation:none!important}}
/* 머리의 '처음으로' 버튼 */
.homebtn{flex:none;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);color:var(--brand-ink);font-size:22px;display:flex;align-items:center;justify-content:center}
.homebtn[hidden]{display:none}
.book.compact{padding-top:6px;padding-bottom:6px}
.book.compact .goal,.book.compact .goal-lab,.book.compact .who small,.book.compact .bal small{display:none}
.book.compact .bal b{font-size:22px}
.book.compact .homebtn{width:40px;height:40px}

/* 오늘의 미션 · 우주 탐험 여행 */
.mission{display:flex;flex-direction:column;gap:6px;padding:12px 16px}
.mrow{display:flex;align-items:center;gap:8px;font-size:16px}
.mrow.done{color:var(--muted);text-decoration:line-through}
.mchk{width:22px;height:22px;flex:none;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--brand-ink);background:var(--panel)}
.mrow.done .mchk{background:var(--ok);border-color:var(--ok)}
.tripbar{display:flex;align-items:center;gap:10px;width:100%;margin-top:4px;padding:8px 10px;border-radius:14px;background:#1d2350;color:#fff;text-align:left;min-height:48px}
.tripbar .note{color:#c9d0f0}
.tripbar .gauge{background:rgba(255,255,255,.2)}
.tripbar .stk-ph,.track .stk-ph{font-size:16px}
.track{position:relative;display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:var(--radius);background:linear-gradient(#1d2350,#2a1f4f);color:#fff}
.tstop{position:relative;display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:12px;opacity:.55}
.tstop.done{opacity:1}
.tstop small{display:block;font-size:12px;color:#c9d0f0}
.trocket{position:absolute;right:8px;animation:float 1.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
/* 받아쓰기 */
.dict-in{min-height:56px;border-radius:14px;border:3px solid var(--brand);background:var(--panel);color:var(--ink);padding:0 14px;font:inherit;font-size:21px;width:100%}
.dans{font-family:var(--display);font-size:20px;letter-spacing:.5px}
.dans mark{background:var(--bad-bg);color:var(--bad);border-bottom:3px solid var(--bad);border-radius:4px;padding:0 1px}
.field textarea{border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 12px;font:inherit;width:100%}
@media (prefers-reduced-motion:reduce){.trocket{animation:none}}

/* 게임 놀이터 */
.gcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);min-height:72px}
.gcard img{width:52px;height:52px;flex:none}
.gcard .disp{font-size:20px}
.gcard small{display:block;color:var(--muted);font-size:13px}
.ghud{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:20px}
.ghud .note{font-family:var(--body)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mem.six{grid-template-columns:repeat(4,1fr)}
.mcard{aspect-ratio:3/4;border-radius:14px;border:2px solid var(--line);background:var(--brand);color:var(--brand-ink);font-family:var(--display);font-size:18px;display:flex;align-items:center;justify-content:center;padding:4px;box-shadow:var(--shadow);word-break:keep-all;text-align:center;line-height:1.2}
.mcard.open,.mcard.done{background:var(--panel2);color:var(--ink)}
.mcard.done{border-color:var(--ok);background:var(--ok-bg)}
.mcard img{width:100%;height:auto}
.mcard .back{font-size:26px;color:var(--coin)}
.mcard .face{display:none;width:100%}
.mcard.open .face,.mcard.done .face{display:block}
.mcard.open .back,.mcard.done .back{display:none}
.orbit{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.obtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);font-size:14px;min-height:48px}
.obtn img{width:52px;height:52px}
.obtn.done{border-color:var(--ok);background:var(--ok-bg)}
.obtn .no{position:absolute;top:2px;left:6px;font-family:var(--display);color:var(--ok);font-size:18px}
.spdq{font-family:var(--display);font-size:46px;text-align:center;padding:10px 0}
.spdc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spdc button{min-height:72px;border-radius:16px;background:var(--panel);border:2px solid var(--line);font-family:var(--display);font-size:32px;box-shadow:var(--shadow)}
.flash-ok{animation:fok .3s}
.flash-no{animation:fno .3s}
@keyframes fok{from{background:var(--ok-bg)}}
@keyframes fno{from{background:var(--bad-bg)}}
.slots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.slots span{width:56px;height:60px;border-radius:12px;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:30px}
.slots span.fill{border-style:solid;border-color:var(--brand);background:var(--panel2)}
.tiles{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.tiles button{width:60px;height:60px;border-radius:14px;background:var(--coin);color:var(--coin-ink);font-family:var(--display);font-size:28px;box-shadow:var(--shadow)}
.tiles button[disabled]{opacity:.2}
.tiles button.hint{outline:4px solid var(--ok);outline-offset:2px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.catchbox{position:relative}
.catchbox canvas{display:block;width:100%;border-radius:var(--radius);background:linear-gradient(#cfe9f7,#e7f3ee);touch-action:none}
@media (prefers-reduced-motion:reduce){.shake,.flash-ok,.flash-no{animation:none}}
.fb-pet{float:right;width:76px;height:76px;margin:-6px -6px 0 6px}
@keyframes hop{0%,100%{transform:translate(-50%,0)}40%{transform:translate(-50%,-14px)}}
.room .pet.hop{animation:hop .5s ease-out 2}
@media (prefers-reduced-motion:reduce){.room .pet.hop{animation:none}.gauge i{transition:none}}
.cta-reward{display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--radius);background:var(--coin);color:var(--coin-ink);box-shadow:var(--shadow);text-align:left;width:100%}
.cta-reward .disp{font-size:21px}

/* 설정(단원/난이도) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:99px;border:2px solid var(--line);background:var(--panel2);font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.chip[disabled]{opacity:.45}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.diff{padding:12px 6px;border-radius:14px;border:2px solid var(--line);background:var(--panel2);text-align:center}
.diff .disp{display:block;font-size:20px}
.diff small{color:var(--muted)}
.diff[aria-pressed="true"]{border-color:var(--coin);background:var(--coin);color:var(--coin-ink)}
.diff[aria-pressed="true"] small{color:var(--coin-ink)}
.stars{letter-spacing:2px}

/* 문제 */
.qhead{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.qhead .combo{margin-left:auto;font-family:var(--display);color:var(--kor);font-size:17px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);transition:width .3s}
.qtext{font-family:var(--display);font-size:24px;line-height:1.45;white-space:pre-line;word-break:keep-all}
.passage{background:var(--panel2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;white-space:pre-line;font-size:17px}
.qvis{display:flex;flex-direction:column;align-items:center;gap:6px;overflow-x:auto}
.clock-legend{font-size:13px;display:flex;gap:10px}
.qtable{border-collapse:collapse;font-size:16px;text-align:center;background:var(--panel)}
.qtable caption{font-size:14px;color:var(--muted);padding-bottom:4px}
.qtable th,.qtable td{border:1px solid var(--line);padding:6px 9px}
.qtable th{background:var(--panel2);font-weight:400}
.qgraph{width:100%;max-width:340px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.gcap{font-size:14px;color:var(--muted);text-align:center;margin-bottom:4px}
.grow{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:4px 0}
.glab{width:64px;flex:none}
.gdots{letter-spacing:3px;color:var(--brand);font-size:18px}
.groups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.grp{border:2px dashed var(--line);border-radius:12px;padding:4px 6px;font-size:22px}
.choices{display:grid;gap:10px}
.choice{width:100%;text-align:left;padding:14px 16px;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-size:19px;box-shadow:var(--shadow);word-break:keep-all}
.choice.big{text-align:center;font-family:var(--display);font-size:28px}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.no{border-color:var(--bad);background:var(--bad-bg)}
.choice.off{opacity:.35;text-decoration:line-through}
.choice[disabled]{cursor:default}
.ansbox{min-height:64px;border-radius:14px;border:3px solid var(--brand);background:var(--panel);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:34px;letter-spacing:2px}
.ansbox.empty{color:var(--muted);font-size:18px;letter-spacing:0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:56px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-family:var(--display);font-size:26px;box-shadow:var(--shadow)}
.pad button.go{background:var(--brand);color:var(--brand-ink);font-size:20px}
.feedback{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.feedback.ok{background:var(--ok-bg);border:2px solid var(--ok)}
.feedback.no{background:var(--bad-bg);border:2px solid var(--bad)}
.feedback .disp{font-size:22px}
.hintbox{border-radius:14px;padding:12px 14px;background:var(--panel2);border:2px dashed var(--coin);font-size:16px}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,0);font-family:var(--display);font-size:40px;color:var(--coin);text-shadow:0 2px 0 var(--coin-ink);pointer-events:none;animation:pop 1s ease-out forwards;z-index:30}
@keyframes pop{0%{opacity:0;transform:translate(-50%,20px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
@media (prefers-reduced-motion:reduce){.pop{animation:none;opacity:0}.goal i,.bar i{transition:none}}

/* 통장 거래내역 */
.ledger{width:100%;border-collapse:collapse;font-size:14px}
.ledger th{font-weight:400;color:var(--muted);text-align:right;border-bottom:2px solid var(--brand);padding:6px 4px}
.ledger th:first-child,.ledger td:first-child,.ledger th:nth-child(2),.ledger td:nth-child(2){text-align:left}
.ledger td{border-bottom:1px dashed var(--line);padding:7px 4px;text-align:right;vertical-align:top}
.ledger .in{color:var(--ok)} .ledger .out{color:var(--bad)}
.tscroll{overflow-x:auto}

/* 채팅 */
.chat{display:flex;flex-direction:column;gap:10px;min-height:260px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-break:keep-all}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:0 14px;font:inherit}

/* 부모 */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:14px;color:var(--muted)}
.field input,.field select{min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);padding:0 12px;font:inherit;width:100%}
.pinshow{display:flex;justify-content:center;gap:12px;font-size:30px;letter-spacing:4px;font-family:var(--display)}
.note{font-size:14px;color:var(--muted)}
.cert-img{width:100%;border-radius:16px;border:1px solid var(--line)}
.center{text-align:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:15px;z-index:40;max-width:calc(100% - 32px)}
.big-num{font-family:var(--display);font-size:44px;color:var(--brand)}
hr{border:0;border-top:1px dashed var(--line);margin:4px 0}
</style>
</head>
<body>

<div class="book" id="book"></div>
<div class="wrap" id="view" style="margin-top:14px"></div>
<div class="toast" id="toast" hidden></div>

<script src="math-gen.js"></script>
<script src="bank-g2.js"></script>
<script src="games-data.js"></script>
<script src="learn-data.js"></script>
<script src="room-data.js"></script>
<script src="play-data.js"></script>
<script>
(function(){
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = (n) => n.toLocaleString('ko-KR') + '원';
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
// 받침 여부로 조사 고르기: josa('오랜만','이라고','라고') → '오랜만이라고'
const josa = (w, withB, noB) => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return w + (c >= 0 && c <= 11171 && c % 28 ? withB : noB); };
const shuffle = (a) => { a = a.slice(); for (let i = a.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const DIFF_NAME = {1:'쉬움',2:'보통',3:'어려움'};
const STARS = {1:'★',2:'★★',3:'★★★'};

const SUBJECTS = [
  {id:'math', name:'수학', c:'var(--math)', grades:[2,3,4]},
  {id:'kor',  name:'국어', c:'var(--kor)',  grades:[2,3,4]},
  {id:'int',  name:'통합교과', c:'var(--int)', grades:[2], sub:'마을 · 세계 · 안전'},
  {id:'soc',  name:'사회', c:'var(--soc)', grades:[3,4]},
  {id:'sci',  name:'과학', c:'var(--sci)', grades:[3,4]},
  {id:'eng',  name:'영어', c:'var(--eng)', grades:[3,4]},
  {id:'mor',  name:'도덕', c:'var(--mor)', grades:[3,4]},
];

// ───── 저장 ─────
const KEY = 'chukchuk-bank-v1';
// 부모님이 고른 추천 링크 (부모님 메뉴에서 바꿀 수 있음)
const DEF_LINKS = [
  { title:'NASA Space Place', url:'https://spaceplace.nasa.gov', note:'행성과 우주 이야기 (영어)' },
  { title:'국립과천과학관', url:'https://www.sciencecenter.go.kr', note:'천체투영관과 우주 전시' },
  { title:'EBS 초등', url:'https://primary.ebs.co.kr', note:'학년별 강좌와 창의체험' },
  { title:'사이언스올', url:'https://www.scienceall.com', note:'과학 영상과 과학 만화' },
  { title:'국립어린이청소년도서관', url:'https://www.nlcy.go.kr', note:'사서 선생님 추천 책' },
];
// 첫 화면 '오늘의 궁금증' — 날마다 하나씩 바뀐다
const WONDERS = [
  '하늘은 왜 파란색일까?', '달은 왜 날마다 모양이 바뀌어 보일까?', '고양이는 왜 수염이 있을까?', '비는 어디에서 오는 걸까?',
  '무지개는 왜 여러 가지 색일까?', '개미는 어떻게 집으로 가는 길을 찾을까?', '추운 날 입김은 왜 하얗게 보일까?', '가을이 되면 나뭇잎 색은 왜 바뀔까?',
  '꿀벌은 꿀을 어떻게 만들까?', '아무도 공룡을 본 적이 없는데, 공룡이 있었다는 걸 어떻게 알까?', '바닷물은 왜 짤까?', '밤하늘의 별은 왜 반짝반짝 빛날까?',
  '번개가 번쩍한 뒤에 천둥소리는 왜 늦게 들릴까?', '얼음은 왜 물에 동동 뜰까?', '풍선을 머리에 문지르면 왜 머리카락이 달라붙을까?', '거미는 왜 자기 거미줄에 안 붙을까?',
  '코끼리는 긴 코로 어떤 일을 할까?', '딸꾹질은 왜 날까?', '다른 사람이 하품하면 왜 나도 하품이 날까?', '비 오는 날 지렁이는 왜 땅 위로 나올까?',
  '소금을 물에 넣으면 어디로 사라질까?', '비행기는 그렇게 무거운데 어떻게 하늘을 날까?', '그림자는 왜 아침과 저녁에 더 길어질까?', '눈송이는 왜 모양이 다 다를까?',
  '박쥐는 깜깜한 밤에 어떻게 부딪히지 않고 날까?', '다른 나라 친구들은 어떻게 인사할까?', '1부터 10까지 더하면 얼마일까? 빨리 더하는 방법이 있을까?', '종이를 반으로 몇 번까지 접을 수 있을까?',
  '거울 속의 나는 왜 왼쪽과 오른쪽이 바뀌어 보일까?', '새는 전깃줄에 앉아도 왜 괜찮을까?', '우리는 왜 밤마다 잠을 자야 할까?', '물고기는 물속에서 어떻게 숨을 쉴까?',
  '낮에는 왜 별이 안 보일까?', '씨앗 속에는 무엇이 들어 있을까?', '우리 동네 지도를 그린다면 꼭 넣어야 할 곳은 어디일까?', '옛날 사람들은 시계 없이 시간을 어떻게 알았을까?',
];
// 우주 궁금증 — 이틀에 한 번은 이쪽에서 나온다
const SPACE_WONDERS = [
  '태양계에서 가장 큰 행성은 어디일까? 영어로는 뭐라고 부를까?', '토성의 고리는 무엇으로 되어 있을까?', '화성은 왜 붉은색으로 보일까?', '우주에서는 왜 소리가 들리지 않을까?',
  '우주비행사는 우주정거장에서 어떻게 잠을 잘까?', '달에 남긴 발자국은 왜 아주 오래 남아 있을까?', '지구는 빙글빙글 도는데 우리는 왜 어지럽지 않을까?', '별똥별은 사실 무엇일까?',
  '목성에 있는 커다란 빨간 점은 무엇일까?', '밤하늘에서 행성과 별은 어떻게 구별할 수 있을까?', '블랙홀은 왜 까맣게 보일까?', '수성은 태양과 가장 가까운데, 왜 금성이 더 뜨거울까?',
  '달은 왜 늘 같은 얼굴만 보여 줄까?', '해왕성(Neptune)은 왜 파랗게 보일까?', '우주에서 지구를 보면 어떤 모습일까?', '태양도 별이라는데, 왜 다른 별보다 훨씬 크고 밝아 보일까?',
];
// 아이 이름은 비워 둘 수 있다(비우면 제목이 '척척 용돈통장'). 아이마다 자기 폰에서 이름을 넣는다
const DEF_SETTINGS = { name:'', grade:2, sem:2, review:true, reward:{1:10,2:30,3:50}, comboBonus:50, penalty:0, dailyCap:1000, goal:5000, pin:'0000', aiUrl:'', aiToken:'', aiDaily:20, petCap:200, links:DEF_LINKS, likes:'우주, 태양계 행성', sound:true, gameCap:10, learnReward:20, aiVoice:true, voiceIn:true };
const DEF_PET = { exp:0, full:100, lastDay:'', owned:[], wear:[], dex:[] };
let S;
function load(){
  let raw = null; try { raw = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
  S = Object.assign({ balance:0, ledger:[], wrong:[], stats:{solved:0,correct:0,bestCombo:0}, daily:{date:'',earned:0,ai:0}, seen:{} }, raw || {});
  S.settings = Object.assign({}, DEF_SETTINGS, S.settings || {});
  S.settings.reward = Object.assign({}, DEF_SETTINGS.reward, S.settings.reward || {});
  if (S.settings.name === '우리 딸' || S.settings.name === '우리 아이') S.settings.name = ''; // 예전 기본값은 지운다
  S.pet = Object.assign({}, DEF_PET, S.pet || {});
  S.games = Object.assign({ best:{} }, S.games || {});
  S.attend = Object.assign({ days:[], last:'', streak:0, best:0 }, S.attend || {}); // 출석 도장
  S.stickers = S.stickers || {};   // 우주 스티커 { planetId: 받은 장수 }
  S.report = S.report || {};       // 날짜별 과목 기록 { 'YYYY-MM-DD': { math:[푼 수, 맞힌 수] } }
  S.units = S.units || {};         // 단원별 누적 { 'math|단원': [푼 수, 맞힌 수] }
  S.learn = Object.assign({ done:{}, ox:{} }, S.learn || {}); // 배움터: 통과한 개념 카드, 맞힌 백과 OX
  S.trip = Object.assign({ fuel:0, stop:0, laps:0 }, S.trip || {}); // 우주 탐험 여행: 연료(이번 바퀴), 도착한 곳 수, 완주 횟수
  S.dict = Object.assign({ best:{} }, S.dict || {});                // 받아쓰기 급수별 최고 점수
  S.dream = Object.assign({ name:'', price:0, icon:'🎁', photo:'', since:'', done:[] }, S.dream || {}); // 꿈 저금통
  S.ai = Object.assign({ hearts:0, greetDate:'', greet:'', stories:[], diary:[] }, S.ai || {});       // 척척이: 친구 하트, 오늘 인사, 이야기 책, 일기
  S.board = Object.assign({ bg:'sky', items:[], seq:0 }, S.board || {});                              // 스티커 놀이판
  S.egg = Object.assign({ date:'' }, S.egg || {});                                                    // 오늘의 행운 알 연 날짜
  S.care = Object.assign({ date:'', done:{}, gift:false }, S.care || {});                             // 도토리 돌보기(하루 한 번씩)
  S.code = Object.assign({ stars:{}, allDone:false }, S.code || {});                                  // 코딩 놀이 단계별 별
  // 방꾸미기: 벽지·바닥, 가진 가구 수, 놓은 가구(위치·크기·뒤집기), 도토리 위치
  S.room = Object.assign({ wall:'mint', floor:'wood', walls:['mint'], floors:['wood'], owned:{}, placed:[], pet:{ x:50, y:80, s:1, f:false }, seq:0 }, S.room || {});
  if (!S.room.moved) { // 예전 펫 가게에서 산 통나무 집·나뭇잎 이불을 방으로 옮긴다
    for (const id of ['leaf', 'house']) if ((S.pet.owned || []).includes(id) && !S.room.owned[id]) {
      const it = window.RoomData.ITEMS.find((x) => x.id === id);
      S.room.owned[id] = 1; S.room.placed.push({ u:++S.room.seq, id, x:id === 'house' ? 20 : 50, y:it.y, s:1, f:false });
    }
    S.room.moved = true;
  }
  const keep = new Date(Date.now() - 60 * 86400000).toISOString().slice(0, 10);
  for (const k of Object.keys(S.report)) if (k < keep) delete S.report[k];
  S.settings.links = (Array.isArray(S.settings.links) ? S.settings.links : DEF_LINKS).map((l) => Object.assign({}, l));
  if (!raw) S.ledger.push({ t:Date.now(), memo:'통장 만들기', in:0, out:0, bal:0 });
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
function daily(){ if (S.daily.date !== today()) S.daily = { date:today(), earned:0, ai:0, spent:0, games:{}, plays:0, stickers:0, m:{}, gift:false }; return S.daily; }
function addLedger(memo, amt){ S.ledger.push({ t:Date.now(), memo, in:amt>0?amt:0, out:amt<0?-amt:0, bal:S.balance }); if (S.ledger.length > 300) S.ledger = S.ledger.slice(-300); }

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2200); }
function popCoin(text){ const d = document.createElement('div'); d.className = 'pop'; d.textContent = text; document.body.appendChild(d); setTimeout(() => d.remove(), 1100); sfx('coin'); }

// ───── 효과음 (파일 없이 Web Audio로 만든다) ─────
let AC = null;
const SFX = {
  ok:   [[880, 0, .12], [1320, .1, .2]],
  no:   [[247, 0, .16], [196, .12, .22]],
  coin: [[1568, 0, .07], [2093, .07, .14]],
  tap:  [[660, 0, .06]],
  win:  [[523, 0, .12], [659, .1, .12], [784, .2, .12], [1047, .3, .3]],
};
function sfx(kind){
  if (!S.settings.sound || !SFX[kind]) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime;
    for (const [f, st, du] of SFX[kind]) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = kind === 'no' ? 'triangle' : 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + st); g.gain.exponentialRampToValueAtTime(0.16, t + st + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + st + du);
      o.connect(g).connect(AC.destination); o.start(t + st); o.stop(t + st + du + 0.02);
    }
  } catch (e) { /* 소리가 안 나도 앱은 그대로 */ }
}

// ───── 스티커 앨범 ─────
// 앨범은 차례로 열린다(앞 앨범을 다 모으면 다음 앨범). 같은 스티커를 SHINY_AT장 모으면 반짝 스티커. 하루 STICKER_DAILY장까지
const STICKER_DAILY = 3, SHINY_AT = 3;
const STK = () => window.GameData.STICKERS, SETS = () => window.GameData.STICKER_SETS;
const setItems = (setId) => STK().filter((x) => x.set === setId);
const setDone = (setId) => setItems(setId).every((x) => S.stickers[x.id]);
const stkCount = () => STK().filter((x) => S.stickers[x.id]).length;

  const open = openSets(), pool = STK().filter((x) => open.includes(x.set)), missing = pool.filter((x) => !S.stickers[x.id]);

// ───── 문제 공급 ─────
function mathUnits(){
  const s = S.settings, M = window.MathGen.MATH_UNITS;
  let list = (M[`g${s.grade}s${s.sem}`] || []).slice();
  if (s.review && s.sem === 2) list = list.concat(M[`g${s.grade}s1`] || []);
  if (s.review && s.sem === 1 && s.grade > 2) list = list.concat(M[`g${s.grade-1}s2`] || []);
  return list;
}
function bankFor(subj){ const g = (window.QBANK || {})['g' + S.settings.grade]; return (g && g[subj]) || []; }
function unitsFor(subj){
  if (subj === 'math') return mathUnits().map((u) => ({ id:u.id, name:u.name }));
  return [...new Set(bankFor(subj).map((q) => q.unit))].map((u) => ({ id:u, name:u }));
}
function normBank(b){
  const choices = shuffle([b.ans, ...b.wrong]);
  return { subject:b.subject, unit:b.unit, diff:b.diff, q:b.q, passage:b.passage, type:'mc', choices, answer:choices.indexOf(b.ans), explain:b.explain, key:b.subject + '|' + b.q };
}
function buildRound(subj, unitIds, diff){
  const out = [];
  if (subj === 'math') {
    const units = mathUnits().filter((u) => unitIds.includes(u.id)); const keys = new Set();
    for (let tries = 0; out.length < 10 && tries < 80; tries++) {
      const q = window.MathGen.genMath(units[Math.floor(Math.random()*units.length)], diff);
      if (keys.has(q.key)) continue; keys.add(q.key); out.push(q);
    }
    return out;
  }
  const pool = bankFor(subj).filter((q) => unitIds.includes(q.unit));
  const rank = (q) => (S.seen[q.subject + '|' + q.q] || 0) + Math.random();
  const exact = pool.filter((q) => q.diff === diff).sort((a,b) => rank(a) - rank(b));
  const near = pool.filter((q) => q.diff !== diff).sort((a,b) => Math.abs(a.diff-diff) - Math.abs(b.diff-diff) || rank(a) - rank(b));
  return exact.concat(near).slice(0, 10).map(normBank);
}

const MISSIONS = [

// 틀린 곳 표시: 글자 단위 LCS로 정답과 비교해 정답에서 빠지거나 다른 글자를 빨갛게
function dictDiff(ans, mine){
  const a = [...ans], b = [...mine], n = a.length, m = b.length, L = Array.from({ length:n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = '';
  while (i < n) { if (j < m && a[i] === b[j]) { out += esc(a[i]); i++; j++; } else if (j < m && L[i][j + 1] >= L[i + 1][j]) j++; else { out += `<mark>${a[i] === ' ' ? '␣' : esc(a[i])}</mark>`; i++; } }
  return out;
}

// 최근 7일 동안 모은 속도로 남은 날을 어림하고, 방꾸미기에서 50원 이상 살 때 "꿈까지 며칠 더"를 한 번 묻는다.
// 실제 돈은 움직이지 않는다(부모님이 '용돈 지급'으로 처리)
const DREAM_ICONS = ['🎁', '🧸', '🧱', '🎨', '📚', '🚲', '⚽', '🎹', '🛼', '🪀', '🐶', '🦖'];
const DREAM_ASK_MIN = 50;

function dreamPace(){ // 최근 7일 하루 평균 모은 돈. 통장을 만든 지 7일이 안 됐으면 실제 쓴 날수로 나눈다
  const now = Date.now(), first = S.ledger.length ? S.ledger[0].t : now;
  const span = Math.min(7, Math.max(1, Math.ceil((now - first) / 86400000)));

// ───── 코딩 놀이 ─────
// 화살표 명령을 순서대로 놓아 도토리를 열매까지. 7단계부터 '반복'(한 명령을 2~4번). 돈·API 없음
// 별: 최소 명령 수로 풀면 ★★★, +2개까지 ★★, 그보다 많으면 ★. 모든 단계를 깨면 스티커 한 번
const ARROW = { U:'↑', D:'↓', L:'←', R:'→' };
function codeView(){
  const L = GD.CODE_LEVELS, st = S.code.stars;
  $('#view').innerHTML = `<div class="card" style="display:flex;flex-direction:column;gap:12px">
    <h2 style="font-size:24px">코딩 놀이</h2>
    <p class="note" style="margin:0">명령을 순서대로 놓아 도토리를 도토리 열매까지 보내요. 컴퓨터는 명령을 <b>순서대로</b>, <b>시킨 그대로</b> 해요!</p>
    <div class="lvgrid">${L.map((lv, i) => { const open = i === 0 || st[i - 1]; const s = st[i] || 0;
      return `<button data-lv="${i}" ${open ? '' : 'disabled'} aria-label="${i + 1}단계 ${esc(lv.name)}${open ? '' : ' 잠김'}"><b>${i + 1}</b><small>${esc(lv.name)}</small><span class="lvstar">${open ? '★'.repeat(s) + '☆'.repeat(3 - s) : '🔒'}</span>${i === 6 ? '<em>반복</em>' : ''}</button>`; }).join('')}</div>
    <p class="note" style="margin:0">1~6단계: 순서 · 7~10단계: 반복으로 명령을 줄여요</p>
    <button class="btn block" id="back">돌아가기</button></div>`;
  $('#view').querySelectorAll('[data-lv]').forEach((b) => b.onclick = () => codePlay(+b.dataset.lv));
  $('#back').onclick = home;
}
function codePlay(i){
  const lv = GD.CODE_LEVELS[i], P = GD.codeParse(lv), best = GD.codeBest(lv);
  let prog = [], rep = 1, running = false;
  const cell = (x, y) => { const c = lv.map[y][x];
    return `<div class="ccell ${c === '#' ? 'rock' : ''}" data-xy="${x},${y}">${c === 'G' ? '<img src="img/item/acorn.webp" alt="도착" width="40" height="40">' : c === '*' ? '<span class="cstar">★</span>' : ''}</div>`; };
  $('#view').innerHTML = `<div class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="row"><h2 style="font-size:20px">${i + 1}단계 · ${esc(lv.name)}</h2><span class="note" style="margin-left:auto">명령 칸 ${lv.slots}개</span></div>
    ${lv.repeat ? '<p class="note" style="margin:0"><b>반복</b>: 숫자를 먼저 고르고 화살표를 누르면 "→ 3번"처럼 한 칸에 여러 번 움직여요.</p>' : P.stars.length ? '<p class="note" style="margin:0">★ 별을 모두 모은 다음 도착해야 해요.</p>' : ''}
    <div class="cboard" id="cboard">${lv.map.map((row, y) => [...row].map((_, x) => cell(x, y)).join('')).join('')}<img class="cpet" id="cpet" src="img/pet/happy.webp" alt="도토리"></div>
    <div class="cprog" id="cprog" aria-label="내 명령"></div>
    ${lv.repeat ? `<div class="crep" id="crep">${[1, 2, 3, 4].map((n) => `<button data-n="${n}" aria-pressed="${n === 1}">${n}번</button>`).join('')}</div>` : ''}
    <div class="cpad">${['U', 'L', 'D', 'R'].map((d) => `<button data-d="${d}" aria-label="${{ U:'위', D:'아래', L:'왼쪽', R:'오른쪽' }[d]}">${ARROW[d]}</button>`).join('')}</div>
    <div class="grid2"><button class="btn" id="cClear">다 지우기</button><button class="btn primary" id="cRun">▶ 실행</button></div>
    <div id="cmsg"></div>
    <button class="btn ghost block" id="back">단계 고르기</button></div>`;
  const board = $('#cboard'), pet = $('#cpet');
  const place = (x, y) => { pet.style.left = (x * 20) + '%'; pet.style.top = (y * 20) + '%'; };
  const reset = () => { place(P.start[0], P.start[1]); board.querySelectorAll('.cstar').forEach((s) => s.classList.remove('got')); board.querySelectorAll('.ccell').forEach((c) => c.classList.remove('bump')); };
  const drawProg = (cur) => {
    $('#cprog').innerHTML = Array.from({ length:lv.slots }, (_, k) => { const c = prog[k];
      return c ? `<button class="cslot ${k === cur ? 'now' : ''}" data-k="${k}" aria-label="${k + 1}번째 명령 지우기">${ARROW[c.d]}${c.n > 1 ? `<small>${c.n}번</small>` : ''}</button>` : '<span class="cslot empty"></span>'; }).join('');
    $('#cprog').querySelectorAll('[data-k]').forEach((b) => b.onclick = () => { if (running) return; prog.splice(+b.dataset.k, 1); sfx('tap'); drawProg(); });
  };
  reset(); drawProg();
  if (lv.repeat) $('#crep').onclick = (e) => { const b = e.target.closest('[data-n]'); if (!b) return; rep = +b.dataset.n; $('#crep').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); };
  $('.cpad').onclick = (e) => { const b = e.target.closest('[data-d]'); if (!b || running) return;
    if (prog.length >= lv.slots) return toast(`명령 칸은 ${lv.slots}개까지예요${lv.repeat ? '. 반복을 써 봐요!' : ''}`);
    prog.push({ d:b.dataset.d, n:lv.repeat ? rep : 1 }); sfx('tap'); drawProg(); $('#cmsg').innerHTML = ''; };
  $('#cClear').onclick = () => { if (running) return; prog = []; drawProg(); reset(); $('#cmsg').innerHTML = ''; };
  $('#cRun').onclick = async () => {
    if (running || !prog.length) return prog.length ? null : toast('먼저 명령을 놓아 봐요!');
    running = true; reset(); $('#cmsg').innerHTML = '';
    const r = GD.codeRun(lv, prog), wait = (ms) => new Promise((ok) => setTimeout(ok, ms));
    // 몇 번째 명령을 하는 중인지 표시하며 한 칸씩 움직인다
    let step = 1;
    for (let k = 0; k < prog.length && step < r.path.length; k++) {
      drawProg(k);
      for (let t = 0; t < prog[k].n && step < r.path.length; t++, step++) {
        const [x, y] = r.path[step]; place(x, y); sfx('tap');
        const s = board.querySelector(`[data-xy="${x},${y}"] .cstar`); if (s) s.classList.add('got');
        await wait(380);
      }
    }
    if (r.result === 'crash') { const c = board.querySelector(`[data-xy="${r.at[0]},${r.at[1]}"]`); if (c) c.classList.add('bump'); }
    drawProg(); await wait(200);
    if (r.result === 'goal') {
      const n = prog.length, stars = n <= best ? 3 : n <= best + 2 ? 2 : 1, before = S.code.stars[i] || 0;
      if (stars > before) S.code.stars[i] = stars;
      let extra = '';
      if (!S.code.allDone && GD.CODE_LEVELS.every((_, k) => S.code.stars[k])) { S.code.allDone = true; const p = grantSticker(); extra = p ? ' 모든 단계를 깨서 스티커를 받았어요!' : ' 모든 단계를 깼어요!'; }
      save(); sfx('win'); if (!before) mission('game');
      $('#cmsg').innerHTML = `<div class="feedback ok"><span class="disp">도착! ${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</span><span>명령 ${n}개로 해냈어요.${stars < 3 ? ` ${best}개로도 할 수 있어요. 도전!` : ' 가장 짧은 코드예요!'}${extra}</span>
        ${i + 1 < GD.CODE_LEVELS.length ? '<button class="btn primary block" id="cNext">다음 단계</button>' : ''}</div>`;
      if ($('#cNext')) $('#cNext').onclick = () => codePlay(i + 1);
    } else {
      sfx('no');
      $('#cmsg').innerHTML = `<div class="feedback no"><span class="disp">${{ crash:'앗, 부딪혔어요!', nostar:'별을 다 모으지 않았어요!', short:'아직 도착하지 못했어요!' }[r.result]}</span><span>${{ crash:'돌이나 벽이 있는 쪽으로 갔어요. 어느 명령에서 부딪혔는지 찾아 봐요.', nostar:'★을 모두 지나간 다음 열매로 가야 해요.', short:'명령을 더 놓아서 끝까지 가 봐요.' }[r.result]} 명령을 눌러서 지우고 고쳐 봐요.</span></div>`;
    }
    running = false;
  };
  $('#back').onclick = codeView;
}

// ───── 가게 공통: 적립금으로 사기 (펫 먹이·방꾸미기가 하루 쓰기 한도 petCap을 같이 쓴다) ─────
function shopSpend(price, memo){
  const d = daily(), cap = S.settings.petCap, spent = d.spent || 0;
  if (S.balance < price) { toast('잔액이 모자라요. 문제를 풀어서 모아 봐요!'); return false; }
  if (spent + price > cap) { toast(`오늘은 ${won(cap)}까지만 쓸 수 있어요. 내일 또 사요!`); return false; }
  S.balance -= price; d.spent = spent + price; addLedger(memo, -price); save(); renderBook(); sfx('coin');
  return true;
}

function wordGame(){
  if (!gameStart()) return;
  const space = shuffle(GD.WORDS.filter((w) => w.cat === '우주'))[0];
  const list = [space, ...shuffle(GD.WORDS.filter((w) => w !== space)).slice(0, 4)];
  let idx = 0, stars = 0;
  const play = () => {
    const it = list[idx], chars = [...it.w], tiles = GD.wordTiles(it); let pos = 0, miss = 0;
    $('#view').innerHTML = `<div class="card" style="display:flex;flex-direction:column;gap:14px">

      <div class="slots" id="slots">${chars.map(() => '<span></span>').join('')}</div>
      <div class="tiles" id="tiles">${tiles.map((t, i) => `<button data-i="${i}">${esc(t)}</button>`).join('')}</div>
      <div id="wmsg"></div>
      <button class="btn ghost block" id="quitG">그만하기</button></div>`;
    $('#quitG').onclick = gamesView;
    $('#tiles').onclick = (e) => {
      const b = e.target.closest('button'); if (!b || b.disabled || pos >= chars.length) return;
      if (b.textContent === chars[pos]) {
        b.disabled = true; b.classList.remove('hint'); const s = $('#slots').children[pos]; s.textContent = chars[pos]; s.classList.add('fill'); pos++; sfx('tap');
        if (pos === chars.length) {
          if (miss <= 1) stars++; sfx('ok');
          $('#wmsg').innerHTML = `<div class="feedback ok"><span class="disp">${esc(it.w)}${miss <= 1 ? ' ★' : ''}</span>${it.cat === '맞춤법' ? `<span>${esc(josa(it.w, '이라고', '라고'))} 써요. 헷갈리는 글자에 속지 않았어요!</span>` : ''}</div>`;
          setTimeout(() => { idx++; idx < list.length ? play() : finish(); }, it.cat === '맞춤법' ? 1600 : 900);
        }
      } else {
        miss++; sfx('no'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
        if (miss >= 3) { const h = [...$('#tiles').children].find((x) => !x.disabled && x.textContent === chars[pos]); if (h) h.classList.add('hint'); }
      }

function catchGame(){
  if (!gameStart()) return;
  $('#view').innerHTML = `<div class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="ghud"><span id="cS">0점</span><span id="cH" aria-label="남은 하트">♥♥♥</span><span class="note" style="margin-left:auto"><span id="cT">30</span>초</span></div>
    <div class="catchbox"><canvas id="cv" width="360" height="440" aria-label="도토리 받기 게임. 화면을 좌우로 움직여 다람쥐를 옮겨요"></canvas></div>
    <p class="note center">손가락으로 좌우로 움직여요. 돌멩이는 피해요!</p>
    <button class="btn ghost block" id="quitG">그만하기</button></div>`;
  const cv = $('#cv'), x = cv.getContext('2d'), W = cv.width, H = cv.height;
  const load = (src) => { const i = new Image(); i.src = src; return i; };
  const img = { pet:load('img/pet/happy.webp'), acorn:load('img/item/acorn.webp'), walnut:load('img/item/walnut.webp') };
  const P = { x:W / 2, w:84 }; let items = [], score = 0, hearts = 3, t0 = performance.now(), last = t0, spawn = 0, over = false;
  const moveTo = (cx) => { const r = cv.getBoundingClientRect(); P.x = Math.max(P.w / 2, Math.min(W - P.w / 2, (cx - r.left) / r.width * W)); };
  cv.addEventListener('pointerdown', (e) => moveTo(e.clientX)); cv.addEventListener('pointermove', (e) => { if (e.pointerType !== 'mouse' || e.buttons) moveTo(e.clientX); });
  const key = (e) => { if (e.key === 'ArrowLeft') P.x = Math.max(P.w / 2, P.x - 28); if (e.key === 'ArrowRight') P.x = Math.min(W - P.w / 2, P.x + 28); };
  document.addEventListener('keydown', key);
  const stop = () => { over = true; document.removeEventListener('keydown', key); };
  $('#quitG').onclick = () => { stop(); gamesView(); };
  const frame = (now) => {
    if (over) return; if (!document.body.contains(cv)) return stop();
    const dt = Math.min(50, now - last) / 1000; last = now; const el = (now - t0) / 1000;
    spawn -= dt;
    if (spawn <= 0) { const r = Math.random(); items.push({ x:20 + Math.random() * (W - 40), y:-30, k:r < 0.12 ? 'walnut' : r < 0.34 ? 'rock' : 'acorn', v:120 + el * 6 + Math.random() * 60 }); spawn = Math.max(0.35, 0.8 - el * 0.012); }
    x.clearRect(0, 0, W, H);
    for (const it of items) {
      it.y += it.v * dt;
      if (it.k === 'rock') { x.fillStyle = '#8a8f8d'; x.strokeStyle = '#18352f'; x.lineWidth = 3; x.beginPath(); x.ellipse(it.x, it.y, 17, 13, 0, 0, Math.PI * 2); x.fill(); x.stroke(); }
      else x.drawImage(img[it.k], it.x - 18, it.y - 18, 36, 36);
      if (!it.hit && it.y > H - 80 && it.y < H - 20 && Math.abs(it.x - P.x) < P.w / 2) {
        it.hit = true;
        if (it.k === 'rock') { hearts--; sfx('no'); $('#cH').textContent = '♥'.repeat(hearts) + '♡'.repeat(3 - hearts); } else { score += it.k === 'walnut' ? 3 : 1; sfx('tap'); }
        $('#cS').textContent = score + '점';
      }
    }
    items = items.filter((it) => !it.hit && it.y < H + 30);
    x.drawImage(img.pet, P.x - P.w / 2, H - P.w - 4, P.w, P.w);
    const left = Math.max(0, 30 - Math.floor(el)); $('#cT').textContent = left;
    if (left <= 0 || hearts <= 0) { stop(); const nb = setBest('catch', score);
      return gameEnd({ id:'catch', title:`${score}점`, lines:[hearts <= 0 ? '돌멩이에 세 번 맞았어요!' : '30초 동안 열심히 모았어요!', nb ? '새 최고 기록이에요!' : `최고 기록 ${S.games.best.catch}점`, '재미로 하는 게임이라 돈은 쌓이지 않아요.'], again:catchGame }); }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

function storyPlay(words){
  const msgs = [{ role:'user', content:'이야기를 시작해 줘.' }], lines = []; let turns = 0, done = false;
  $('#view').innerHTML = `<div class="card" style="display:flex;flex-direction:column;gap:12px">
    <div class="row">${chukFace('read', 48)}<span style="flex:1"><h2 style="font-size:20px">이야기 짓기</h2><span class="note">${words.map(esc).join(' · ')}</span></span></div>

    <button class="btn block" id="back">척척이에게 돌아가기</button></div>`;
  const setBusy = (b) => { if (!$('#stIn')) return; $('#stIn').disabled = b || done; $('#stForm button:not(.micbtn)').disabled = b || done; $('#stEnd').disabled = b || done || turns < 1; };
  const addLine = (who, t) => { lines.push({ who, text:t }); $('#story').insertAdjacentHTML('beforeend', `<p class="${who}">${who === 'ai' ? chukFace('read', 24) : '<b>나</b> '}${esc(t)}</p>`); $('#story').lastElementChild.scrollIntoView({ block:'nearest' }); };
  const turn = async (end) => {
    setBusy(true); $('#story').insertAdjacentHTML('beforeend', '<p class="ai wait">척척이가 쓰는 중…</p>');
    try {
      const t = await aiCall({ mode:'story', words, end, messages:msgs }, 'story', msgs[msgs.length - 1].content);
      $('#story .wait').remove(); msgs.push({ role:'assistant', content:t }); addLine('ai', t); speakAI(t);
      if (end) finish(t);
    } catch (e) { $('#story .wait').remove(); toast(aiErr(e)); if (!msgs.some((m) => m.role === 'assistant')) { $('#back').click(); return; } }
    setBusy(false);
  };
  const finish = (last) => {
    done = true; const m = last.match(/제목\s*:\s*(.+)$/m), title = m ? m[1].trim().replace(/["“”]/g, '') : `${words[0]} 이야기`;

    $('#stForm').remove();
  };

    e.preventDefault(); const t = $('#stIn').value.trim(); if (!t || done) return;

    turn(turns >= STORY_TURNS);
  };
  $('#stEnd').onclick = () => { if (done) return; msgs.push({ role:'user', content:'이제 이야기를 끝내 줘.' }); turn(true); };
  bindMic($('#stForm'), $('#stIn'));
  $('#back').onclick = aiHub;
  turn(false);
}

// ───── 학습 리포트 (최근 7일) ─────
const dateKey = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
function reportData(){
  const keys = [6, 5, 4, 3, 2, 1, 0].map((k) => dateKey(new Date(Date.now() - k * 86400000)));
  const bySub = {}; let solved = 0, correct = 0;
  for (const k of keys) for (const [sub, [n, c]] of Object.entries(S.report[k] || {})) { bySub[sub] = bySub[sub] || [0, 0]; bySub[sub][0] += n; bySub[sub][1] += c; solved += n; correct += c; }
  const from = new Date(keys[0]).getTime() - 9 * 3600000; // 7일 전 0시(한국 시간) 근처부터
  let earned = 0, bonus = 0, spentRoom = 0, spentPet = 0;
  for (const e of S.ledger) {
    if (e.t < from) continue;
    if (e.in) { if (e.memo.startsWith('칭찬 보너스')) bonus += e.in; else earned += e.in; }
    if (e.out) { if (e.memo.endsWith('(방꾸미기)')) spentRoom += e.out; else if (e.memo.endsWith(`(${PET_NAME})`)) spentPet += e.out; } // 용돈 지급은 쓴 돈에서 뺀다
  }
  const attend = keys.filter((k) => S.attend.days.includes(k)).length;
  const subName = (id) => (SUBJECTS.find((x) => x.id === id) || { name:id }).name;
  const weak = Object.entries(S.units).filter(([, [n]]) => n >= 5).map(([k, [n, c]]) => ({ sub:subName(k.split('|')[0]), unit:k.split('|')[1], n, rate:c / n }))

    S.chatLog = []; save(); toast('대화 기록을 지웠어요'); parent();
  };
  $('#bkSave').onclick = backupSave;
  $('#bkLoad').onclick = () => $('#bkFile').click();
  $('#bkFile').onchange = (e) => { const fl = e.target.files[0]; if (fl) backupLoad(fl); };
  $('#view').querySelectorAll('[data-dellink]').forEach((b) => b.onclick = () => { s.links.splice(+b.dataset.dellink, 1); save(); toast('링크를 뺐어요'); parent(); });
  $('#addLink').onclick = () => {
    const title = v('lTitle').trim(), url = v('lUrl').trim(), note = v('lNote').trim();
    if (!title) return toast('이름을 넣어 주세요');
    let ok = false; try { ok = new URL(url).protocol === 'https:'; } catch(e) {}
    if (!ok) return toast('주소는 https://로 시작해야 해요');
    s.links.push({ title, url, note }); save(); toast('링크를 넣었어요'); parent();
  };
  $('#reset').onclick = () => {
    $('#resetArea').innerHTML = `<p><b>정말 지울까요?</b> 되돌릴 수 없어요.</p><div class="row"><button class="btn danger" id="resetYes">지우기</button><button class="btn" id="resetNo">취소</button></div>`;
    $('#resetNo').onclick = parent;
    $('#resetYes').onclick = () => { const st = S.settings; try { localStorage.removeItem(KEY); } catch(e) {} load(); S.settings = st; save(); toast('초기화했어요'); parent(); renderBook(); };
  };
  $('#back').onclick = home;
}

new MutationObserver(syncHomeBtn).observe($('#view'), { childList:true }); // 화면이 바뀔 때마다 ← 버튼 보이기/숨기기
load(); save(); home();
})();
</script>

</body>
</html>
